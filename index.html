<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <script src="main.js" defer></script>
    <title>The humble Library</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Welcome to The Humble Library</div>
            <button class="new" data-open-modal>New book</button>
        </div>
        <div class="library">
            <div class="libraryHeader">My Books</div>
        </div>
        <div id="libraryContent"></div>
        <div class="modal">
            <dialog data-modal>
                <form action="#">
                    <div class="bookTitle">
                        <h5>Title</h5>
                        <input type="text" id="title">
                    </div>
                    <div class="author">
                        <h5>Author</h5>
                        <input type="text" id="author">
                    </div>
                    <div class="numberOfPages">
                        <h5>Number of Pages</h5>
                        <input type="number" id="number">
                    </div>
                    <div class="read">
                        <h5>Read ?</h5>
                        <input type="checkbox" id="check">
                    </div>
                    <button type="submit" method="dialog" id="submitBtn">submit</button>

                </form>
            </dialog>
        </div>
    </div>
    
</body>
</html>
